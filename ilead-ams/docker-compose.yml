version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ilead-ams-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ilead_ams}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ilead-network
    restart: unless-stopped

  # Backend API Server
  api:
    build:
      context: ./ilead-ams/backend
      dockerfile: Dockerfile
    container_name: ilead-ams-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-ilead_ams}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-hector.torres@i-leadusa.org}
      SUPER_ADMIN_PIN_HASH: ${SUPER_ADMIN_PIN_HASH:-}
      SUPER_ADMIN_PIN_PLAIN: ${SUPER_ADMIN_PIN_PLAIN:-071676}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-I-LEAD AMS <noreply@i-leadusa.org>}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      CLEARSTREAM_API_KEY: ${CLEARSTREAM_API_KEY:-}
      CLEARSTREAM_ENDPOINT: ${CLEARSTREAM_ENDPOINT:-https://api.getclearstream.com/v1/texts}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      UPLOAD_DIR: ${UPLOAD_DIR:-./uploads}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-ilead-ams-docs}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-52428800}
      GOOGLE_SHEETS_API_KEY: ${GOOGLE_SHEETS_API_KEY:-}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      MAKE_WEBHOOK_URL: ${MAKE_WEBHOOK_URL:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-in-production}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-86400000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./ilead-ams/backend:/app
      - /app/node_modules
      - api_uploads:/app/uploads
    networks:
      - ilead-network
    restart: unless-stopped
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  api_uploads:
    driver: local

networks:
  ilead-network:
    driver: bridge
