# Development docker-compose override
# Run with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

version: '3.8'

services:
  mongodb:
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev_user
      MONGO_INITDB_ROOT_PASSWORD: dev_password
      MONGO_INITDB_DATABASE: ilead_ams_dev
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./ilead-ams/backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      MONGODB_URI: mongodb://dev_user:dev_password@mongodb:27017/ilead_ams_dev?authSource=admin
    volumes:
      - ./ilead-ams/backend/src:/app/src
    command: npm run dev
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./ilead-ams/frontend
      dockerfile: Dockerfile
    environment:
      REACT_APP_ENV: development
      REACT_APP_API_URL: http://localhost:3001
    volumes:
      - ./ilead-ams/frontend/src:/app/src
    ports:
      - "3000:3000"
    command: npm start
